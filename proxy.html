<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Acceso</title>
</head>
<body>

<script>
  const params = new URLSearchParams(window.location.search);
  const destino = params.get("u");
  const origen = params.get("origen") || "desconocido";

  if (!destino) {
    document.body.innerHTML = "<h3>Falta el parámetro ?u=</h3>";
  } else {
    // Guardamos destino y origen para el formulario
    localStorage.setItem("destino_final", destino);
    localStorage.setItem("origen_final", origen);
    window.location.href = "form.html";
  }
</script>

</body>
</html>
